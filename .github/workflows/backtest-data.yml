name: 백테스트 데이터 받기
on:
  push:
    branches: ["claude/**"]
    paths: ["backtest/fetch_qld.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install yfinance==1.7.0 pandas==3.1.0
      - run: python backtest/fetch_qld.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/qld_data.csv
          git commit -m "QLD 백테스트 데이터"
          git push
