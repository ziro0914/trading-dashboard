name: 대시보드 갱신

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 평일 미국장 개장 전(13:00 UTC)과 마감 뒤(21:30 UTC)
    - cron: "0 13 * * 1-5"
    - cron: "30 21 * * 1-5"
    # 모의매매 게시물: 한국시간 밤 11시(14:00 UTC)
    - cron: "0 14 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 모의매매 계획 (밤 11시 실행 또는 수동 실행 때)
        if: github.event.schedule == '0 14 * * 1-5' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python daytrade.py plan
      - name: 모의매매 결과 기록 (장 마감 뒤)
        continue-on-error: true
        run: python daytrade.py result
      - name: 모의매매 기록 먼저 저장 (사이트 빌드가 실패해도 남도록)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/daytrade
          git diff --staged --quiet || (git commit -m "모의매매 기록 저장" && git push)
      - run: python build_site.py
      - name: 순위 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          git diff --staged --quiet || git commit -m "순매수·순매도·모의매매 기록 저장"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
